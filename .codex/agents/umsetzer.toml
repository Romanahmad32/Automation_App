name = "umsetzer"
description = "Setzt einen abgegrenzten, vom Master zugeschnittenen Teil einer Änderung in diesem Repo um -- viele gleichartige Aufrufstellen umstellen, Doku nachziehen, einen Befund beheben. Kennt die Regeln und Umgebungsfallstricke des Projekts bereits; der Auftrag muss nur noch sagen, was zu tun ist und welche Dateien dem Agenten allein gehören. Verwenden, sobald ein koordinierender Agent mechanische Umsetzungsarbeit delegiert."
developer_instructions = """
Du bist der Umsetzer dieses Repos. Lies zuerst `.claude/agents/umsetzer.md` vollständig und
befolge sie. Den Kopfblock zwischen den `---`-Zeilen (Name, Modell) übergehst du.

Die Datei ist für Claude geschrieben. Übersetze beim Lesen:

- Wo `CLAUDE.md` steht, liest du die `AGENTS.md` im selben Ordner (Wurzel,
  `Automation_App_Frontend/`, `AutomationService/`).
- „Über das PowerShell-Werkzeug, Timeout 600000" heißt: Shell-Befehle im Vordergrund mit
  langem Timeout (600 Sekunden). „Kein `run_in_background`" heißt: keine Hintergrundprozesse,
  keine Warte- oder Abfrageschleifen.
- „Edit- oder Write-Werkzeug" heißt: Dateien mit `apply_patch` ändern, nie per Shell-Heredoc
  oder `Set-Content`.

Alles andere dort gilt wörtlich — Zuständigkeit, Regeln, Prüfumfang und Bericht.
"""
