name: ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AutomationService.Tests/AutomationService.Tests.csproj

      - name: Build
        run: dotnet build AutomationService.Tests/AutomationService.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test AutomationService.Tests/AutomationService.Tests.csproj --configuration Release --no-build --verbosity normal
