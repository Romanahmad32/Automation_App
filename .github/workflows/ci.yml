name: ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

env:
  TEST_PROJECT: AutomationService/AutomationService/AutomationService.Tests/AutomationService.Tests.csproj
  FRONTEND_DIR: Automation_App_Frontend
  # Feste Flutter-Version statt "channel: stable". Mit einem gleitenden Kanal
  # baut jeder Lauf gegen eine andere Toolchain, und eine neue Lint-Regel macht
  # die CI rot, ohne dass jemand Code angefasst hat — genau so ist sie am
  # 01.08.2026 rot geworden (der Entwicklerrechner stand auf 3.41.2, der Runner
  # zog 3.44.9). Ein Versionssprung gehoert in einen eigenen Commit, zusammen
  # mit den Anpassungen, die er ausloest. Das .NET-SDK steuert global.json.
  FLUTTER_VERSION: "3.41.2"

jobs:
  backend:
    # Windows, nicht ubuntu: Der Dienst nutzt Word-COM-Interop (PdfConversion)
    # und Playwright gegen installiertes Edge/Chrome — beides gibt es nur hier.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      # Directory.Build.props setzt TreatWarningsAsErrors: eine neue Compiler-
      # oder Analyzer-Warnung bricht hier ab, statt sich unbemerkt anzusammeln.
      # NuGetAudit meldet ausserdem bekannte Luecken in (auch transitiven)
      # Paketen als Fehler.
      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      # Enthaelt die Architektur-Tests unter AutomationService.Tests/Architecture/
      # (Slice-Isolation, Namespace-Konvention, Dateilaengen-Limit).
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --verbosity normal

      # Prueft, ob der Code der Formatierung aus der .editorconfig entspricht.
      # Laeuft nach den Tests: ein Formatierungsfehler soll den Blick nicht von
      # einem echten Testfehler ablenken.
      - name: Format
        run: dotnet format AutomationService/AutomationService.slnx --verify-no-changes --verbosity diagnostic

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Pub get
        run: flutter pub get

      # Analyze laeuft vor den Tests: Fehler hier sind billiger zu finden.
      - name: Analyze
        run: flutter analyze

      # Enthaelt die Architektur-Tests unter test/architecture/ (Schichtenregeln
      # und Dateilaengen-Limit aus CLAUDE.md als ausfuehrbare Regeln).
      - name: Test
        run: flutter test

  # Baut das auslieferbare Paket und startet den veroeffentlichten Dienst.
  #
  # Warum zusaetzlich zu den Jobs oben: die pruefen den Quellcode. Ob daraus ein
  # startfaehiges Produkt wird, ist eine andere Frage — ein fehlender Eintrag in
  # appsettings.json, eine nicht mitkopierte Vorlage oder ein DI-Eintrag, der
  # sich erst zur Laufzeit nicht aufloesen laesst, sind in "dotnet test" und
  # "flutter test" unsichtbar. Genau diese Fehlerklasse faengt dieser Job, und
  # zwar in jedem PR statt erst beim Tag.
  #
  # Er benutzt dieselben Skripte wie der Release-Workflow: was hier gruen ist,
  # ist auch das, was ausgeliefert wird.
  paket:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Platzhalter-Version: die echte vergibt erst der Release-Workflow aus dem
      # Git-Tag. Hier zaehlt nur, dass der Weg dorthin funktioniert.
      - name: Paket bauen
        shell: pwsh
        run: ./scripts/build-package.ps1 -Version 0.0.0 -BuildNumber ${{ github.run_number }}

      - name: Rauchtest
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -PackageDirectory dist/Automation_App -ExpectedVersion 0.0.0
