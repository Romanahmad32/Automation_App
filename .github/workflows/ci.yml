name: ci

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

# Zwei Pushes kurz hintereinander: der erste Lauf prueft einen Stand, den es
# schon nicht mehr gibt. Er wird abgebrochen statt zu Ende gefahren.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PROJECT: AutomationService/AutomationService/AutomationService.Tests/AutomationService.Tests.csproj
  FRONTEND_DIR: Automation_App_Frontend
  # Feste Flutter-Version statt "channel: stable". Mit einem gleitenden Kanal
  # baut jeder Lauf gegen eine andere Toolchain, und eine neue Lint-Regel macht
  # die CI rot, ohne dass jemand Code angefasst hat — genau so ist sie am
  # 01.08.2026 rot geworden (der Entwicklerrechner stand auf 3.41.2, der Runner
  # zog 3.44.9). Ein Versionssprung gehoert in einen eigenen Commit, zusammen
  # mit den Anpassungen, die er ausloest. Das .NET-SDK steuert global.json.
  FLUTTER_VERSION: "3.41.2"

jobs:
  # Geheimnisse im Quellcode. Das Repository ist oeffentlich, und
  # appsettings.json ist der naheliegende Ort, an dem beim Ausprobieren ein
  # echtes Postfach-Passwort landet.
  #
  # Geprueft wird die ganze Historie, nicht nur der Diff: Ein Zugang, der
  # einmal committet und im naechsten Commit wieder entfernt wurde, steht
  # weiter im Repository und ist trotzdem verbrannt. Beim Einbauen lief der
  # Scan ueber alle 157 Commits — ohne Fund; dieser Schritt haelt den Zustand.
  geheimnisse:
    # Als einziger Job auf Linux: hier wird nichts gebaut, nur gelesen, und
    # der Runner startet schneller.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Ohne die volle Historie saehe der Scan nur den letzten Commit.
          fetch-depth: 0

      # Feste Fassung statt :latest — dieselbe Regel wie bei global.json und
      # FLUTTER_VERSION. Eine neue Regelgeneration wuerde sonst ueber Nacht
      # Funde melden, ohne dass jemand etwas geaendert hat.
      #
      # --redact ist Pflicht, kein Feinschliff: Ohne den Schalter schreibt
      # gitleaks den gefundenen Zugang im Klartext ins Protokoll — und die
      # Protokolle dieses Repositories sind oeffentlich lesbar. Der Fund
      # wuerde also genau das tun, wogegen dieser Schritt geschrieben ist.
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --no-banner --redact

  backend:
    # Windows, nicht ubuntu: Der Dienst nutzt Word-COM-Interop (PdfConversion)
    # und Playwright gegen installiertes Edge/Chrome — beides gibt es nur hier.
    runs-on: windows-latest
    # Die Jobs brauchen 6 bis 8 Minuten. Ohne Grenze laeuft ein haengender
    # Prozess — etwa eine nicht beendete Word-Instanz — sechs Stunden weiter.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT }}

      # Directory.Build.props setzt TreatWarningsAsErrors: eine neue Compiler-
      # oder Analyzer-Warnung bricht hier ab, statt sich unbemerkt anzusammeln.
      # NuGetAudit meldet ausserdem bekannte Luecken in (auch transitiven)
      # Paketen als Fehler.
      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      # Enthaelt die Architektur-Tests unter AutomationService.Tests/Architecture/
      # (Slice-Isolation, Namespace-Konvention, Dateilaengen-Limit) und den
      # Abgleich des HTTP-Vertrags: OpenApiVertragTests holt das OpenAPI-Dokument
      # aus dem laufenden Dienst und faellt, wenn es von docs/openapi.json
      # abweicht. Eine Vertragsaenderung muss im Diff auftauchen, sonst bricht
      # sie das Frontend erst zur Laufzeit.
      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-build --verbosity normal

      # Prueft Zeilenenden, Kodierung und Einrueckung gegen die .editorconfig.
      # Laeuft nach den Tests: ein Formatierungsfehler soll den Blick nicht von
      # einem echten Testfehler ablenken.
      #
      # Nur `whitespace`, nicht das ganze `dotnet format`: Directory.Build.props
      # setzt EnforceCodeStyleInBuild und TreatWarningsAsErrors, jede IDE-Regel
      # und jeder Analyzer-Befund bricht also schon den Build-Schritt oben.
      # `style` und `analyzers` pruefen dieselben Regeln mit derselben Schwelle
      # ein zweites Mal und kosten dabei 42 der 50 Sekunden. Zeilenenden und
      # Kodierung sieht der Compiler dagegen gar nicht — das ist der Teil, der
      # hier wirklich gebraucht wird.
      #
      # Zwei Aufrufe, weil AutomationService.slnx nur das Dienstprojekt
      # enthaelt: Das Testprojekt liegt in dessen Ordner, ist aber per
      # Compile Remove ausgenommen und wurde deshalb nie geprueft.
      - name: Format (Dienst)
        run: dotnet format whitespace AutomationService/AutomationService.slnx --verify-no-changes --verbosity diagnostic

      - name: Format (Tests)
        run: dotnet format whitespace ${{ env.TEST_PROJECT }} --verify-no-changes --verbosity diagnostic

  frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Pub get
        run: flutter pub get

      # pubspec.lock ist versioniert und muss zu FLUTTER_VERSION passen. Das
      # Framework pinnt meta, matcher und test_api exakt (nicht mit Caret), und
      # Dependabot sieht diese Pins nicht: es loest mit dem reinen Dart-SDK auf
      # und traegt Fassungen ein, die es mit dem gepinnten Flutter nicht gibt.
      # `pub get` stuft sie dann still zurueck — die Sperrdatei beschreibt danach
      # einen Stand, der nie gelaufen ist, und wer sie mitcommittet, traegt eine
      # Herabstufung ein, die niemand beschlossen hat. Hier faellt das auf.
      - name: Sperrdatei passt zur Toolchain
        run: git diff --exit-code -- pubspec.lock

      # Die generierten Dateien sind versioniert (injection.config.dart,
      # app_router.gr.dart). Wer eine @injectable-Klasse oder eine Route
      # hinzufuegt und build_runner vergisst, bricht die Anwendung zur Laufzeit:
      # analyze und test bleiben gruen, weil der alte generierte Stand weiter
      # uebersetzt, und das Fehlen faellt erst beim DI-Aufloesen oder beim
      # Navigieren auf. Deshalb hier neu erzeugen und mit dem committeten
      # Stand vergleichen.
      - name: Codegenerierung
        run: dart run build_runner build

      - name: Generierter Stand aktuell
        run: >
          git diff --exit-code --
          lib/core/di/injection.config.dart
          lib/core/router/app_router.gr.dart

      # Gegenstueck zu "dotnet format whitespace" im Backend-Job. Ohne
      # diese Pruefung sammelt sich Formatierungsrauschen in den Dart-Diffs und
      # verdeckt die eigentliche Aenderung — teuer in jedem Review.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      # Analyze laeuft vor den Tests: Fehler hier sind billiger zu finden.
      # --no-pub bei analyze und test: `flutter pub get` ist ein eigener Schritt
      # weiter oben. Ohne den Schalter holen beide es noch einmal nach.
      - name: Analyze
        run: flutter analyze --no-pub

      # Enthaelt die Architektur-Tests unter test/architecture/ (Schichtenregeln,
      # Dateilaengen-Limit und das Verbot privater Typen aus CLAUDE.md als
      # ausfuehrbare Regeln) sowie den Abgleich der Dart-Seite gegen den
      # versionierten HTTP-Vertrag docs/openapi.json.
      #
      # --concurrency: Die Vorgabe ist Kerne/2, auf dem Runner also zwei. Die
      # Testlaeufe sind aber start- und nicht rechenlastig (je Datei eine eigene
      # VM); gemessen auf vier Kernen 73 s bei der Vorgabe gegen 51 s bei acht.
      # Dieselbe Zahl steht in scripts/check.ps1.
      - name: Test
        run: flutter test --no-pub --concurrency=8

  # Baut das auslieferbare Paket und startet den veroeffentlichten Dienst.
  #
  # Warum zusaetzlich zu den Jobs oben: die pruefen den Quellcode. Ob daraus ein
  # startfaehiges Produkt wird, ist eine andere Frage — ein fehlender Eintrag in
  # appsettings.json, eine nicht mitkopierte Vorlage oder ein DI-Eintrag, der
  # sich erst zur Laufzeit nicht aufloesen laesst, sind in "dotnet test" und
  # "flutter test" unsichtbar. Genau diese Fehlerklasse faengt dieser Job, und
  # zwar in jedem PR statt erst beim Tag.
  #
  # Er benutzt dieselben Skripte wie der Release-Workflow: was hier gruen ist,
  # ist auch das, was ausgeliefert wird.
  paket:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Platzhalter-Version: die echte vergibt erst der Release-Workflow aus dem
      # Git-Tag. Hier zaehlt nur, dass der Weg dorthin funktioniert.
      - name: Paket bauen
        shell: pwsh
        run: ./scripts/build-package.ps1 -Version 0.0.0 -BuildNumber ${{ github.run_number }}

      - name: Rauchtest
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -PackageDirectory dist/Automation_App -ExpectedVersion 0.0.0
