# Aktualisierungen kommen als Pull Request herein, bevor sie als Buildfehler
# hereinkommen.
#
# Der Grund steht in Directory.Build.props: NuGetAudit laeuft mit
# NuGetAuditMode=all und NuGetAuditLevel=low, und TreatWarningsAsErrors macht
# jeden Fund zum Fehler. Das ist gewollt — so ist die Microsoft.OpenApi-Luecke
# aufgefallen. Es hat aber eine unangenehme Kehrseite: eine neu veroeffentlichte
# Meldung gegen irgendein transitives Paket bricht den Build, ohne dass jemand
# Code angefasst haette. Und weil release.yml denselben Build faehrt, blockiert
# sie dann auch eine Auslieferung — im schlechtesten Moment, naemlich genau
# dann, wenn man etwas ausliefern wollte.
#
# Dagegen hilft nicht, die Pruefung abzuschalten, sondern frueher Bescheid zu
# wissen. Dependabot-Alerts und die automatischen Sicherheits-PRs sind in den
# Repository-Einstellungen dafuer ebenfalls eingeschaltet.
version: 2

# Gebuendelt wird nur, was zusammen gruen bleibt: die Gruppen nehmen
# ausdruecklich nur "minor" und "patch". Major-Spruenge kommen einzeln.
#
# Das ist Erfahrung, nicht Vorsicht: im ersten Durchlauf steckte Dependabot alles
# in je einen PR, und darin lag jeweils ein unvertraeglicher Major-Sprung
# (Microsoft.OpenApi 3.x, file_picker 11). Ein einziges kaputtes Paket hat so
# vierzehn harmlose Aktualisierungen mit blockiert, darunter Sicherheitspatches.
# Einzeln ist ein roter Major-PR das, was er ist: eine Entscheidung, keine
# Routine.
updates:
  # Ein Sammel-PR je Woche und Oekosystem statt eines PR je Paket: bei rund
  # zwanzig Abhaengigkeiten waere die Alternative ein Posteingang voller
  # Einzelmeldungen, den man nach zwei Wochen ignoriert. Sicherheitsupdates
  # umgehen den Wochentakt und kommen sofort und einzeln.
  - package-ecosystem: "nuget"
    # Explizit statt "/": es gibt vier Projekte in drei Ebenen, und ein
    # uebersehenes bliebe stillschweigend ungepflegt.
    directories:
      - "/AutomationService/AutomationService"
      - "/AutomationService/AutomationService/AutomationService.Tests"
      - "/tools/TemplateParametrizer"
      - "/tools/ZentralrufDomDump"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Microsoft.OpenApi 3.x ist mit .NET 10 nicht baubar: dort ist
      # IOpenApiMediaType.Example schreibgeschuetzt, waehrend der
      # Source-Generator von Microsoft.AspNetCore.OpenApi weiterhin dorthin
      # zuweist (CS0200 in OpenApiXmlCommentSupport.generated.cs). Der Fehler
      # steht in generiertem Code — nicht reparierbar, das SDK erzeugt die Datei
      # bei jedem Build neu.
      #
      # Die 2er-Linie wird weiter gepflegt (aktuell 2.11.0) und ist seit 2.7.5
      # gegen GHSA-v5pm-xwqc-g5wc gepatcht; der Pin im csproj bleibt also
      # wirksam. Aufheben, wenn das Projekt auf .NET 11 geht.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "NuGet"

  # Bei "pub" ist die vorgeschlagene pubspec.lock nur ein Vorschlag, kein
  # Ergebnis. Dependabot hat kein Flutter zur Hand und loest mit dem reinen
  # Dart-SDK auf; die exakten Pins des Frameworks (meta, matcher, test_api in
  # packages/flutter{,_test}/pubspec.yaml) sieht es deshalb nicht und traegt
  # Fassungen ein, die es mit der in .fvmrc gepinnten Fassung nicht geben kann.
  # Genau so ist 5e80b05 hereingekommen: ein Stand, den jeder `pub get` still
  # zurueckstufte.
  #
  # Das ist der teuerste Dauerbrenner der CI: 9 von 20 roten Laeufen zwischen
  # dem 06.07. und dem 09.09.2026 kamen von Dependabot, 8 davon aus dieser
  # Gruppe.
  #
  # Zwei Wege, auf denen so ein Paket hereinkommt, und sie brauchen
  # verschiedene Antworten:
  #
  #   1. Als *Nebenwirkung* der Aufloesung. So ist 5e80b05 entstanden: Der PR
  #      hob elf direkte Pakete, und meta, matcher und test_api wanderten
  #      unangekuendigt mit — sie stehen in keiner Zeile des PR-Textes. Dagegen
  #      hilft die "ignore"-Liste unten *nicht*, denn Dependabot aktualisiert
  #      sie ja gar nicht, es waehlt sie beim Aufloesen mit. Was hier hilft,
  #      ist der Schritt "Sperrdatei passt zur Toolchain" in ci.yml: er macht
  #      so einen PR rot statt still. Die Behebung ist immer dieselbe —
  #      `flutter pub get` mit der gepinnten Fassung laufen lassen und die
  #      dabei entstandene pubspec.lock in den PR nachtragen.
  #   2. Als angekuendigte Aktualisierung — Dependabot kann auch transitive
  #      Pakete einzeln heben. Genau dafuer steht die Liste unten: Ein solcher
  #      PR waere garantiert rot, weil das Framework die Fassung exakt vorgibt.
  #      Ihn gar nicht erst aufmachen zu lassen, ist billiger, als ihn jede
  #      Woche wegzuraeumen.
  - package-ecosystem: "pub"
    directory: "/Automation_App_Frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Was das Framework in packages/flutter{,_test}/pubspec.yaml **exakt**
      # pinnt, gehoert zur Toolchain und nicht in einen Abhaengigkeits-PR. Die
      # Liste nennt die drei, die hier tatsaechlich gedriftet sind (c644476:
      # matcher, meta, test_api). Das Framework pinnt noch mehr auf diese Weise
      # — characters, collection, path, stack_trace, clock, fake_async,
      # stream_channel, vector_math, material_color_utilities,
      # leak_tracker_flutter_testing. Sie stehen hier bewusst nicht auf Vorrat:
      # Taucht eine davon in einem roten PR auf, kommt sie dazu, und dann steht
      # ein Beleg daneben statt einer Vermutung.
      - dependency-name: "meta"
      - dependency-name: "matcher"
      - dependency-name: "test_api"
    commit-message:
      prefix: "Flutter"

  # Die Actions selbst. Sie haengen an Major-Tags (@v4), die von sich aus nicht
  # springen — hier geht es darum, den Sprung ueberhaupt mitzubekommen, statt
  # drei Jahre auf einer abgekuendigten Version zu stehen.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"
